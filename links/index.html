<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket+ | Links</title>
<meta name="description" content="Download Pocket+ and follow along on YouTube, Instagram and X.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://pocketplus.app/links/">

<style>
  :root {
    --bg: #04000b;
    --purple: #1f074d;
    --purple-deep: #11042c;
    --yellow: #f9d235;
    --cyan: #00d9ff;
    --red: #f34648;
    --grey: #d7d7d7;
    --text: #ffffff;
    --muted: rgba(215, 215, 215, .68);
    --line: rgba(255, 255, 255, .12);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="light"]) { /* the page stays dark on purpose: it matches the video */ }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: "Stack Sans Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 400;
    background:
      radial-gradient(900px 620px at 50% -10%, rgba(31, 7, 77, .95), transparent 70%),
      radial-gradient(520px 380px at 85% 100%, rgba(0, 217, 255, .10), transparent 70%),
      radial-gradient(480px 360px at 10% 60%, rgba(249, 210, 53, .08), transparent 70%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 56px 16px 40px;
  }
  .card { width: 100%; max-width: 440px; text-align: center; }
  .logo {
    display: block; width: 200px; height: 200px; margin: 8px auto 20px;
    border-radius: 50%; /* full circle */
    box-shadow: 0 18px 50px rgba(249, 210, 53, .18);
  }
  h1 {
    font-family: "Stack Sans Headline", system-ui, sans-serif;
    font-weight: 500; font-size: 34px; letter-spacing: -.02em; margin: 0 0 8px;
  }
  h1 span { color: #ffffff; }
  .tag { margin: 0 auto 30px; color: var(--muted); font-size: 16px; line-height: 1.45; max-width: 340px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    position: relative; display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 16px 18px; border-radius: 16px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    font-size: 17px; font-weight: 400;
    transition: background .5s ease, border-color .5s ease, transform .5s ease;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .btn:hover, .btn:focus-visible { background: rgba(255, 255, 255, .10); border-color: rgba(255, 255, 255, .24); transform: translateY(-2px); outline: none; }
  .btn .ico {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 11px;
    display: grid; place-items: center; background: rgba(255, 255, 255, .08);
  }
  .btn .ico svg { width: 19px; height: 19px; fill: currentColor; }
  .btn .label { flex: 1; text-align: left; }
  .btn .label small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .btn .arrow { color: var(--muted); font-size: 18px; transition: transform .5s ease; }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn.primary {
    background: var(--yellow); color: #04000b; border-color: transparent;
    font-family: "Stack Sans Headline", system-ui, sans-serif; font-weight: 500;
    box-shadow: 0 14px 40px rgba(249, 210, 53, .22);
  }
  .btn.primary .ico { background: rgba(4, 0, 11, .10); }
  .btn.primary .label small { color: rgba(4, 0, 11, .62); }
  .btn.primary .arrow { color: rgba(4, 0, 11, .6); }
  .btn.primary:hover { background: #ffe25c; border-color: transparent; }
  .btn.yt .ico { color: var(--red); }
  .btn.ig .ico { color: #ff5c9a; }
  .btn.x .ico { color: var(--text); }
  .sep { height: 1px; background: var(--line); margin: 14px 0 4px; }
  .foot { margin-top: 34px; color: var(--muted); font-size: 13px; }
  .foot a { color: var(--cyan); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .btn, .btn .arrow { transition: none; } }
</style>
<script>

</script>
</head>

        <span class="label">Instagram<small>@pocketplus.app</small></span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a class="btn x" href="/links/x/">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18.2 2.3h3.4l-7.4 8.5L23 21.7h-6.8l-5.3-7-6.1 7H1.4l7.9-9L1 2.3h7l4.8 6.4 5.4-6.4zm-1.2 17.5h1.9L7.1 4.2H5.1l11.9 15.6z"/></svg></span>

        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a class="btn ph" href="/producthunt/">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#da552f"/><path fill="#fff" d="M8.6 6.8h3.8a3.4 3.4 0 0 1 0 6.8h-1.7v2.6H8.6V6.8zm2.1 2v2.8h1.6a1.4 1.4 0 0 0 0-2.8h-1.6z"/></svg></span>
        <span class="label">Product Hunt<small>Support us with an upvote</small></span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
    </nav>

    <div class="sep"></div>
    <p class="foot"><a href="/">pocketplus.app</a> &middot; <a href="/privacy/">Privacy</a></p>  </div>
