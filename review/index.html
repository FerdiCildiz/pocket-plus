<style>
  :root { --bg-0:#190e2e; --bg-3:#06040b; --ink:#f3f2ff; --gold:#ffc02e; --muted:rgba(243,242,255,.68); --line:rgba(255,255,255,.14); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg-3); color:var(--ink); }
  body { font-family:"Stack Sans Text", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:17px; line-height:1.55;
    background: radial-gradient(900px 620px at 50% -10%, #2a1457, transparent 70%), radial-gradient(520px 380px at 90% 100%, rgba(255,192,46,.08), transparent 70%), var(--bg-3); }
  main { max-width:560px; margin:0 auto; padding:40px 20px 72px; }
  .brand { display:flex; align-items:center; justify-content:center; gap:14px; margin:0 0 30px; text-decoration:none; color:var(--ink); }
  .brand img { width:56px; height:56px; display:block; }
  .brand span { font-family:"Stack Sans Headline", sans-serif; font-weight:500; font-size:34px; letter-spacing:-.5px; }
  h1 { font-family:"Stack Sans Headline", sans-serif; font-weight:400; font-size:34px; line-height:1.15; letter-spacing:-.5px; text-align:center; margin:0 0 10px; }
  .sub { text-align:center; color:var(--muted); margin:0 0 30px; }
  form { background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:24px; padding:26px 22px 24px; }
  label, .lab { display:block; font-weight:500; margin:0 0 8px; }
  .opt { color:var(--muted); font-weight:300; }
  .stars { display:flex; flex-direction:row-reverse; justify-content:center; gap:6px; margin:0 0 24px; }
  .stars input { position:absolute; opacity:0; pointer-events:none; }
  .stars label { margin:0; cursor:pointer; font-size:46px; line-height:1; color:rgba(255,255,255,.22); transition:color .25s ease, transform .25s ease; }
  .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color:var(--gold); }
  .stars input:focus-visible + label { outline:2px solid var(--gold); outline-offset:4px; border-radius:8px; }
  textarea, input[type=text], input[type=email] { width:100%; font:inherit; color:var(--ink); background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 20px; }
  textarea { min-height:140px; resize:vertical; }
  textarea:focus, input:focus { outline:2px solid rgba(255,192,46,.6); outline-offset:1px; }
  .hint { color:var(--muted); font-size:14px; margin:-12px 0 20px; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  button { width:100%; font:inherit; font-weight:500; font-size:19px; height:54px; border:0; border-radius:999px; background:var(--gold); color:#000; cursor:pointer; transition:transform .25s ease, opacity .25s ease; }
  button:hover { transform:translateY(-1px); } button:disabled { opacity:.55; cursor:default; transform:none; }
  .err { color:#ff8a8a; text-align:center; margin:14px 0 0; min-height:1.5em; }
  .done { text-align:center; padding:28px 8px; }
  .done .big { font-size:56px; line-height:1; color:var(--gold); margin:0 0 14px; }
  .done h2 { font-family:"Stack Sans Headline", sans-serif; font-weight:400; font-size:28px; margin:0 0 8px; }
  .done p { color:var(--muted); margin:0 0 22px; }
  .done a { color:var(--gold); }
  .foot { text-align:center; color:var(--muted); font-size:14px; margin:26px 0 0; }
  .foot a { color:var(--muted); }
</style>

  btn.disabled = true; btn.textContent = "Sending...";
  try {
    const r = await fetch(API + "/submit", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(d) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { f.hidden = true; document.getElementById("done").hidden = false; window.scrollTo({ top:0, behavior:"smooth" }); return; }
    err.textContent = msg[j.error] || msg.bad;
  } catch { err.textContent = msg.net; }
  btn.disabled = false; btn.textContent = "Send review";
});
</script>
</body>
