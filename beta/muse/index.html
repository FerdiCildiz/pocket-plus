<style>
:root{color-scheme:dark;--bg:#0c0c18;--card:#171728;--line:#2a2a44;--fg:#f4f4fa;--dim:#9393b3;--acc:#f9d235}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,system-ui,sans-serif;padding:24px 16px 64px}
main{max-width:720px;margin:auto}
h1{font-size:28px;margin:8px 0 12px;line-height:1.2}h2{font-size:19px;margin:34px 0 8px}
.lead{font-size:17px;color:#dcdcee}.dim{color:var(--dim)}.note{color:var(--dim);font-size:14px}
ul,ol{padding-left:22px}li{margin:6px 0}
kbd{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
table{border-collapse:collapse;width:100%;margin:10px 0}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--dim);font-size:13px;font-weight:600}
.dl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:18px 0 6px}
button{font:inherit;cursor:pointer}
#dl{background:var(--acc);color:#111;border-radius:999px;padding:11px 22px;font-weight:600;text-decoration:none;display:inline-block}
#login{margin-top:28vh;text-align:center}
#login input{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;width:240px;margin-right:6px}
#login button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:10px 18px}
#err{color:#ff8a8a;margin-top:12px;min-height:1.4em;font-size:14px}
</style></head><body>

const $=id=>document.getElementById(id),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let key=null;
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
const dec=(k,iv,data)=>crypto.subtle.decrypt({name:"AES-GCM",iv},k,data);
async function unlock(pw){
  const k=await derive(pw);
  const buf=b64(P.html);
  const html=new TextDecoder().decode(await dec(k,buf.slice(0,12),buf.slice(12)));
  key=k;$("login").hidden=true;$("app").innerHTML=html;$("app").hidden=false;
  try{sessionStorage.setItem("btpw",pw)}catch(e){}
}
$("f").onsubmit=async e=>{e.preventDefault();$("err").textContent="";
  try{await unlock($("pw").value.trim())}catch(x){$("err").textContent="Wrong password"}};
(async()=>{let saved="";try{saved=sessionStorage.getItem("btpw")||""}catch(e){}
  $("login").hidden=false;if(saved){try{await unlock(saved)}catch(e){}}})();
